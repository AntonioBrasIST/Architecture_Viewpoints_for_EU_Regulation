CRITICAL INTERACTIVE GATE: After compiling the Discrepancy Audit, you MUST use the 'question' tool to present the reconciliation choices directly to the operator (Header: 'Confirm Reconciliation'), forcing an explicit selection of either 'Apply Recommended Fixes' or 'Abort and Keep Files' before executing any synchronized file updates.
"""
